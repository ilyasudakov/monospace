<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Петербургский метрополитен — OSM</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<style>
  :root {
    --paper: #ffffff;
    --ink: #1b1612;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font-family: ui-monospace, "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
  }

  .topbar {
    padding: 10px 14px;
    border-bottom: 1px solid var(--ink);
    display: flex; gap: 18px; align-items: baseline; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .topbar h1 {
    margin: 0; font-size: 12px; letter-spacing: 0.18em; font-weight: 600;
  }
  .topbar .status { color: #55483c; font-size: 10px; letter-spacing: 0.06em; }
  .topbar .status.err { color: #b3261e; text-transform: none; letter-spacing: 0; }

  #map { flex: 1; background: #fff; }

  /* minimal label chips */
  .leaflet-tooltip.st-label {
    background: rgba(255,255,255,0.85);
    border: none;
    box-shadow: none;
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    padding: 1px 4px;
    white-space: nowrap;
    font-weight: 500;
  }
  .leaflet-tooltip.st-label::before { display: none; }

  .leaflet-container { font-family: inherit; }
  .leaflet-control-attribution {
    font-size: 9px;
    background: rgba(255,255,255,0.85);
  }
</style>
</head>
<body>
  <header class="topbar">
    <h1>Петербургский метрополитен · OSM</h1>
    <span class="status" id="status">загрузка через Overpass…</span>
  </header>
  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
(async function () {
  const statusEl = document.getElementById('status');
  const setStatus = (t, err) => {
    statusEl.textContent = t;
    statusEl.classList.toggle('err', !!err);
  };

  const map = L.map('map', { zoomControl: true, preferCanvas: true })
                .setView([59.93, 30.32], 11);

  // Light monochrome OSM-based tiles (Carto Positron — no labels variant kept minimal)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">Carto</a> · данные: <a href="https://overpass-api.de/">Overpass</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  // Официальные цвета Петербургского метрополитена
  const lineColor = {
    '1': '#d6083b', // Кировско-Выборгская — красная
    '2': '#0078be', // Московско-Петроградская — синяя
    '3': '#009a49', // Невско-Василеостровская — зелёная
    '4': '#ea7125', // Правобережная — оранжевая
    '5': '#702082', // Фрунзенско-Приморская — фиолетовая
    '6': '#c9a57a'  // Красносельско-Калининская — коричневая (план.)
  };
  const normalizeColor = (_c, ref) => lineColor[ref] || '#1b1612';

  const query = `
    [out:json][timeout:90];
    rel["route"="subway"]["network"~"Петербургский метрополитен|Saint Petersburg",i];
    (._;>;);
    out body;
  `;

  let data;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    setStatus('ошибка overpass: ' + e.message, true);
    return;
  }

  const nodes = new Map(), ways = new Map(), rels = [];
  for (const el of data.elements) {
    if (el.type === 'node') nodes.set(el.id, el);
    else if (el.type === 'way') ways.set(el.id, el);
    else if (el.type === 'relation') rels.push(el);
  }

  // Merge into lines keyed by ref (line number)
  const lines = new Map();
  for (const rel of rels) {
    const t = rel.tags || {};
    const ref = t.ref || t.ref_colour || 'x';
    if (!lines.has(ref)) {
      lines.set(ref, {
        ref,
        color: normalizeColor(t.colour, ref),
        name: t.name || '',
        stations: new Map(),  // node id → {name, lat, lon}
        tracks: []            // array of [[lat,lon], ...]
      });
    }
    const line = lines.get(ref);
    for (const m of rel.members || []) {
      if (m.type === 'node') {
        const n = nodes.get(m.ref);
        if (!n || !n.tags) continue;
        const isStation =
          n.tags.railway === 'station' ||
          n.tags.railway === 'stop' ||
          n.tags.public_transport === 'stop_position' ||
          /stop/.test(m.role || '');
        if (!isStation) continue;
        if (!line.stations.has(n.id)) {
          line.stations.set(n.id, {
            id: n.id,
            name: n.tags.name || '',
            lat: n.lat, lon: n.lon
          });
        }
      } else if (m.type === 'way') {
        const w = ways.get(m.ref);
        if (!w || !w.nodes) continue;
        const coords = [];
        for (const nid of w.nodes) {
          const n = nodes.get(nid);
          if (n) coords.push([n.lat, n.lon]);
        }
        if (coords.length > 1) line.tracks.push(coords);
      }
    }
  }

  if (lines.size === 0) {
    setStatus('пустой ответ от overpass', true);
    return;
  }

  const allStations = []; // keep ALL per-line stations, we'll cluster geographically
  const sortedRefs = [...lines.keys()].sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (isNaN(na) && isNaN(nb)) return a.localeCompare(b);
    if (isNaN(na)) return 1;
    if (isNaN(nb)) return -1;
    return na - nb;
  });

  const bounds = L.latLngBounds();

  for (const ref of sortedRefs) {
    const line = lines.get(ref);
    // tracks
    for (const tr of line.tracks) {
      L.polyline(tr, {
        color: line.color,
        weight: 3.5,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);
      tr.forEach(p => bounds.extend(p));
    }
    // stations
    for (const st of line.stations.values()) {
      allStations.push({ ...st, lineRef: ref });
    }
  }

  // Cluster stations by geographic proximity → transfer groups
  const THRESH_M = 250;
  const distM = (a, b) => {
    const dy = (a.lat - b.lat) * 111320;
    const dx = (a.lon - b.lon) * 111320 * Math.cos(a.lat * Math.PI / 180);
    return Math.sqrt(dx * dx + dy * dy);
  };
  const parent = allStations.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  for (let i = 0; i < allStations.length; i++) {
    for (let j = i + 1; j < allStations.length; j++) {
      if (distM(allStations[i], allStations[j]) < THRESH_M) {
        parent[find(i)] = find(j);
      }
    }
  }
  const groups = new Map();
  allStations.forEach((st, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(st);
  });

  let transferCount = 0;
  for (const group of groups.values()) {
    const lat = group.reduce((s, st) => s + st.lat, 0) / group.length;
    const lon = group.reduce((s, st) => s + st.lon, 0) / group.length;
    const uniqNames = [...new Set(group.map(st => st.name).filter(Boolean))];
    const uniqLines = [...new Set(group.map(st => st.lineRef))];
    const isTransfer = uniqLines.length > 1;
    if (isTransfer) transferCount++;

    const ring = L.circleMarker([lat, lon], {
      radius: isTransfer ? 7 : 3.5,
      color: '#1b1612',
      weight: isTransfer ? 1.6 : 1.1,
      fillColor: '#ffffff',
      fillOpacity: 1
    }).addTo(map);

    if (isTransfer) {
      L.circleMarker([lat, lon], {
        radius: 2.8,
        color: '#1b1612',
        weight: 0,
        fillColor: '#1b1612',
        fillOpacity: 1,
        interactive: false
      }).addTo(map);
    }

    if (uniqNames.length) {
      ring.bindTooltip(uniqNames.join(' / '), {
        permanent: true,
        direction: 'right',
        offset: [isTransfer ? 10 : 6, 0],
        className: 'st-label' + (isTransfer ? ' st-label--tr' : '')
      });
    }
    bounds.extend([lat, lon]);
  }

  if (bounds.isValid()) map.fitBounds(bounds, { padding: [30, 30] });

  // Hide labels at low zoom — they clutter the view
  const syncLabels = () => {
    const z = map.getZoom();
    const show = z >= 12;
    document.querySelectorAll('.st-label').forEach(el => {
      el.style.display = show ? '' : 'none';
    });
  };
  map.on('zoomend', syncLabels);
  syncLabels();

  setStatus(`${groups.size} станций (${transferCount} пересадок) · ${sortedRefs.length} линий · OSM/Overpass`);
})();
</script>
</body>
</html>
